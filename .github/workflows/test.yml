name: API Test Pipeline with Allure Report

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y default-jre wget
    
    - name: Install Allure
      run: |
        wget https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
        tar -zxvf allure-2.24.1.tgz -C /opt/
        ln -s /opt/allure-2.24.1/bin/allure /usr/bin/allure
        allure --version
    
    - name: Run tests
      env:
        DUMMYJSON_BASE_URL: ${{ secrets.DUMMYJSON_BASE_URL }}
        DUMMYJSON_USERNAME: ${{ secrets.DUMMYJSON_USERNAME }}
        DUMMYJSON_PASSWORD: ${{ secrets.DUMMYJSON_PASSWORD }}
      run: |
        pytest tests/ --alluredir=./allure-results -v
      # ❌ 已删除 continue-on-error: true，测试失败时会阻断流水线
    
    - name: Generate Allure HTML report
      if: always()  # 无论测试成功还是失败，都生成报告
      run: |
        allure generate ./allure-results -o ./allure-report --clean
    
    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: ./allure-results
        retention-days: 30
    
    - name: Upload Allure HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
        retention-days: 30
